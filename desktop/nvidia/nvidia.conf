# Enable DRM kernel mode-setting with fbdev emulation — Hyprland (a Wayland
# compositor) needs the Nvidia driver's DRM/KMS path to present frames at all.
options nvidia_drm modeset=1 fbdev=1

# Stop the open-source nouveau driver from loading — if it binds the GPU
# before the proprietary nvidia driver does, Hyprland fails to start or
# renders garbage.
blacklist nouveau

# Belt-and-suspenders: even if nouveau loads at an earlier boot stage than
# the blacklist takes effect, stop it from touching mode-setting itself.
options nouveau modeset=0
